<!doctype html>
<!-- The 1200x630 share card. Rebuild public/og.png with `npm run og` (needs Google Chrome). -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
    @font-face { font-family: "Inter Variable"; src: url("../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; }
    @font-face { font-family: "JetBrains Mono"; src: url("../node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-400-normal.woff2") format("woff2"); }
    * { box-sizing: border-box; margin: 0; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
        position: relative; background: #0c0c0e; color: #c7c8d1;
        font-family: "Inter Variable", sans-serif; font-feature-settings: "cv05" on; -webkit-font-smoothing: antialiased;
        background-image:
            radial-gradient(60% 70% at 88% 85%, rgba(104, 115, 233, 0.22), transparent 70%),
            radial-gradient(40% 50% at 70% 100%, rgba(142, 127, 202, 0.18), transparent 70%);
    }
    .copy { position: absolute; left: 72px; top: 78px; width: 520px; }
    .brand { display: flex; align-items: center; gap: 14px; color: #fff; font-size: 26px; font-weight: 600; letter-spacing: -0.01em; }
    .brand img { width: 46px; height: 46px; border-radius: 10px; }
    .eyebrow { display: flex; align-items: center; gap: 10px; margin-top: 56px; color: #73758c; font-size: 15px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #9cff62; box-shadow: 0 0 12px #9cff62; }
    h1 .emoji { -webkit-text-fill-color: initial; color: initial; background: none; }
    h1 {
        margin-top: 18px; font-size: 64px; line-height: 1.04; letter-spacing: -0.035em; font-weight: 600;
        background: linear-gradient(#fff 6.98%, #ffffff5c 167.44%); -webkit-background-clip: text; color: transparent;
    }
    .lead { margin-top: 24px; font-size: 22px; line-height: 1.45; color: #c7c8d1; }
    .repo { position: absolute; left: 72px; bottom: 60px; font-family: "JetBrains Mono", monospace; font-size: 17px; color: #8f91a3; }
    .repo b { color: #9cff62; font-weight: 400; }
    .shot {
        position: absolute; left: 640px; top: 96px; width: 760px; border-radius: 18px; overflow: hidden;
        box-shadow: 0 40px 90px -10px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(255, 255, 255, 0.08);
    }
    .shot img { display: block; width: 100%; }
</style>
</head>
<body>
    <div class="copy">
        <div class="brand"><img src="../public/icon-192.png" alt="" />Trellis</div>
        <p class="eyebrow"><span class="dot"></span>Open source · native macOS</p>
        <h1>Your terminal, fully organized <span class="emoji">👌</span></h1>
        <p class="lead">A window per project, tabs per window, splits per tab. Plus SSH hosts and an API for AI agents.</p>
    </div>
    <p class="repo"><b>❯</b> github.com/bearstouch/trellis</p>
    <div class="shot"><img src="../src/assets/shots/hero.png" alt="" /></div>
</body>
</html>
